# Crea la release de GitHub del módulo a partir de la versión de shopeame.php.
#
# Adaptada de la plantilla de fsmaker (github-action-release.yml.sample) para un módulo de PrestaShop:
# - La versión sale de $this->version en shopeame.php (tres números). config.xml no cuenta: es una caché que genera
#   PrestaShop y no está en git.
# - El zip contiene una sola carpeta «shopeame», igual que el que genera ~/Trabajos/FacturaScripts/scripts/build.sh:
#   sin lo que lista .distignore ni vendor/, con vendor/ regenerado solo con el autoload de Composer, un index.php en
#   cada carpeta y permisos 755/644.
# - El módulo no tiene changelog: las notas de la release son los commits desde la última etiqueta (o todos, si no
#   hay ninguna), agrupados por su tipo (feat, fix y el resto).
# - Cada release lleva dos copias del zip: «shopeame-<versión>.zip» y «shopeame.zip». La segunda tiene siempre el
#   mismo nombre, así que el enlace https://github.com/<owner>/<repo>/releases/latest/download/shopeame.zip
#   descarga siempre la última release.
# - Cada release lleva también «info.json» (versión, zip de esa etiqueta, versiones de PrestaShop y PHP y changelog).
#   El módulo lo lee desde .../releases/latest/download/info.json para que el gestor de módulos ofrezca «Actualizar».
name: Crear Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODULE_NAME: shopeame

    steps:
      - name: Checkout completo del repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detectar la versión de shopeame.php
        id: version
        run: |
          set -euo pipefail
          MODULE_VERSION=$(grep -m1 -E "\\\$this->version = '" shopeame.php | sed -E "s/.*\\\$this->version = '([^']+)'.*/\1/")
          echo "shopeame.php:  ${MODULE_VERSION}"

          if ! echo "$MODULE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\$this->version de shopeame.php debe tener tres números (X.Y.Z)."
            exit 1
          fi

          if gh release view "v${MODULE_VERSION}" > /dev/null 2>&1; then
            echo "⚠️  La versión ${MODULE_VERSION} ya tiene release publicada. No se hace nada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${MODULE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generar las notas desde los commits
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Última etiqueta v* alcanzable desde este commit; sin ninguna, se toman todos los commits
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"%s" "${LAST_TAG}..HEAD")
            HEADER="## Versión ${VERSION} (desde ${LAST_TAG#v})"
          else
            COMMITS=$(git log --no-merges --pretty=format:"%s" HEAD)
            HEADER="## Versión ${VERSION}"
          fi

          # Los commits siguen Conventional Commits: feat y fix tienen su grupo y el resto va a «Otros cambios»
          NEW_FEATURES=""
          FIXES=""
          OTHERS=""
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            echo "$msg" | grep -qiE "^actualizadas? traducciones?$" && continue
            echo "$msg" | grep -qiE "^versi[oó]n [0-9]" && continue

            if echo "$msg" | grep -qE "^fix(\(.+\))?!?:"; then
              FIXES="${FIXES}"$'\n'"- ${msg}"
            elif echo "$msg" | grep -qE "^feat(\(.+\))?!?:"; then
              NEW_FEATURES="${NEW_FEATURES}"$'\n'"- ${msg}"
            else
              OTHERS="${OTHERS}"$'\n'"- ${msg}"
            fi
          done <<< "$COMMITS"

          {
            echo "$HEADER"
            [ -n "$NEW_FEATURES" ] && printf '\n### ✨ Funcionalidades nuevas\n%s\n' "$NEW_FEATURES"
            [ -n "$FIXES" ] && printf '\n### 🐛 Correcciones\n%s\n' "$FIXES"
            [ -n "$OTHERS" ] && printf '\n### 🔧 Otros cambios\n%s\n' "$OTHERS"
            [ -z "${NEW_FEATURES}${FIXES}${OTHERS}" ] && printf '\n_Sin cambios registrados._\n'
            true
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Configurar PHP y Composer
        if: steps.version.outputs.skip != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Crear el zip del módulo
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUILD_DIR="${RUNNER_TEMP}/build"
          MODULE_DIR="${BUILD_DIR}/${MODULE_NAME}"
          rm -rf "$BUILD_DIR"
          mkdir -p "$MODULE_DIR"

          # Mismo criterio que build.sh: una sola carpeta con el nombre técnico, sin lo que lista .distignore y con
          # vendor/ regenerado solo con el autoload de Composer (sin dependencias de desarrollo)
          rsync -a --exclude-from=.distignore --exclude='vendor' ./ "${MODULE_DIR}/"
          composer dump-autoload --working-dir="$MODULE_DIR" --optimize --no-dev --quiet
          # las carpetas que genera Composer no traen index.php: se copia el de la raíz del módulo, que redirige a la superior
          find "$MODULE_DIR" -type d ! -path "$MODULE_DIR" -exec sh -c '[ -f "$1/index.php" ] || cp "$2" "$1/index.php"' _ {} "${MODULE_DIR}/index.php" \;
          find "$BUILD_DIR" -type d -print0 | xargs -0 chmod 0755
          find "$BUILD_DIR" -type f -print0 | xargs -0 chmod 0644

          ZIP_FILE="${RUNNER_TEMP}/${MODULE_NAME}-${VERSION}.zip"
          (cd "$BUILD_DIR" && zip -qr "$ZIP_FILE" "${MODULE_NAME}")
          cp "$ZIP_FILE" "${RUNNER_TEMP}/${MODULE_NAME}.zip"

          echo "Contenido del zip:"
          unzip -l "$ZIP_FILE"

      - name: Generar info.json para el aviso de actualizaciones
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # El módulo lee https://github.com/<owner>/<repo>/releases/latest/download/info.json (src/Update/UpdateChecker.php)
          # y se lo pasa al gestor de módulos con el hook actionListModules. download_url apunta al zip de esta etiqueta y
          # tiene que terminar en «shopeame.zip»: PrestaShop saca el nombre del módulo del nombre del archivo.
          PS_MIN=$(grep -m1 -E "'min' => '" shopeame.php | sed -E "s/.*'min' => '([^']+)'.*/\1/")
          PS_MAX=$(grep -m1 -E "'max' => '" shopeame.php | sed -E "s/.*'max' => '([^']+)'.*/\1/")
          PHP_MIN=$(jq -r '.require.php // ""' composer.json | sed -E 's/^[^0-9]*//')
          BASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          # Las líneas «- » de las notas de la release, sin el guion
          sed -n -E 's/^- (.+)$/\1/p' "${RUNNER_TEMP}/notes.md" > "${RUNNER_TEMP}/changelog.txt"

          jq -n \
            --arg name "Shopeame" \
            --arg slug "$MODULE_NAME" \
            --arg version "$VERSION" \
            --arg download_url "${BASE_URL}/releases/download/v${VERSION}/${MODULE_NAME}.zip" \
            --arg details_url "${BASE_URL}/releases/tag/v${VERSION}" \
            --arg homepage "$BASE_URL" \
            --arg released "$(date -u +%Y-%m-%d)" \
            --arg ps_min "$PS_MIN" \
            --arg ps_max "$PS_MAX" \
            --arg php_min "$PHP_MIN" \
            --rawfile changelog "${RUNNER_TEMP}/changelog.txt" \
            '{name: $name, slug: $slug, version: $version, download_url: $download_url, details_url: $details_url,
              homepage: $homepage, released: $released, ps_min: $ps_min, ps_max: $ps_max, php_min: $php_min,
              changelog: ($changelog | split("\n") | map(select(length > 0)))}' \
            > "${RUNNER_TEMP}/info.json"
          cat "${RUNNER_TEMP}/info.json"

      - name: Crear la release en GitHub
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Versión ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest \
            "${RUNNER_TEMP}/${MODULE_NAME}-${VERSION}.zip" \
            "${RUNNER_TEMP}/${MODULE_NAME}.zip" \
            "${RUNNER_TEMP}/info.json"

          echo "Release v${VERSION} creada."
          echo "Enlace a la última versión: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/${MODULE_NAME}.zip"
