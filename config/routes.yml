shopeame_generate_api_key:
  path: /shopeame/generate-api-key
  methods: [GET]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::generateApiKey'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_config_form:
  path: /shopeame/configuration
  methods: [GET, POST]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::index'
    # El nombre que se muestra arriba a la izquierda en la barra de navegación
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_register_shop:
  path: /shopeame/register
  methods: [GET]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::registerShop'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_unlink_shop:
  path: /shopeame/unlink
  methods: [POST]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::unlinkShop'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_clear_local_shop:
  path: /shopeame/clear-local
  methods: [POST]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::clearLocalShop'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_check_shop:
  path: /shopeame/check
  methods: [GET]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::checkShop'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame
