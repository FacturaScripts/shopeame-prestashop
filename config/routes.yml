# La configuración va la primera: es la ruta que PrestaShop usa por defecto para el
# _legacy_link «Shopeame» si la pestaña del menú no indica su route_name.
shopeame_config_form:
  path: /shopeame/configuration
  methods: [GET, POST]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::index'
    # El nombre que se muestra arriba a la izquierda en la barra de navegación
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_generate_api_key:
  path: /shopeame/generate-api-key
  methods: [GET]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::generateApiKey'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_register_shop:
  path: /shopeame/register
  methods: [GET]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::registerShop'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_unlink_shop:
  path: /shopeame/unlink
  methods: [POST]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::unlinkShop'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_clear_local_shop:
  path: /shopeame/clear-local
  methods: [POST]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::clearLocalShop'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_check_shop:
  path: /shopeame/check
  methods: [GET]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::checkShop'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_save_invoice_settings:
  path: /shopeame/invoice-settings
  methods: [POST]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::saveInvoiceSettings'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

# Facturas del ERP de los pedidos: _legacy_controller AdminOrders hace que solo entren los
# empleados con permiso de lectura sobre los pedidos (atributo AdminSecurity del controlador)
shopeame_order_invoices:
  path: /shopeame/orders/{orderId}/invoices
  methods: [GET]
  requirements:
    orderId: '\d+'
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\InvoiceController::list'
    _legacy_controller: AdminOrders

shopeame_order_invoice_pdf:
  path: /shopeame/orders/{orderId}/invoices/{invoiceId}/pdf
  methods: [GET]
  requirements:
    orderId: '\d+'
    invoiceId: '\d+'
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\InvoiceController::download'
    _legacy_controller: AdminOrders

shopeame_update_module:
  path: /shopeame/update
  methods: [POST]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::updateModule'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame

shopeame_check_updates:
  path: /shopeame/check-updates
  methods: [GET]
  defaults:
    _controller: 'PrestaShop\Module\Shopeame\Controller\ConfigController::checkUpdates'
    _legacy_controller: Shopeame
    _legacy_link: Shopeame
